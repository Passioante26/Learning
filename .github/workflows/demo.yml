name: Run My Python Script

on: [pull_request]

jobs:
  python-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # THIS IS THE UPDATED CLEAN STEP:
      - name: Execute the Python file
        env:
          MY_SECURE_TOKEN: ${{ secrets.PEGA_API_KEY }}
        run: |
          echo "Connecting securely to the Pega API..."
          echo "Using credential token: $MY_SECURE_TOKEN"
          python hello.py

name: Run My Python Script

on: [push]

jobs:
  python-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute the Python file
        run: python hello.py
